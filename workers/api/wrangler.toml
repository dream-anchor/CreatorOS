name = "creatoros-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "creatoros-storage"
jurisdiction = "eu"

[vars]
ENVIRONMENT = "production"
R2_JURISDICTION = "eu"

[triggers]
# EIN einziger Zeitplan — das Cloudflare-Konto ist am Limit von 5 Cron-Triggern
# (Free-Plan, https://developers.cloudflare.com/workers/platform/limits/).
# Der frühere zweite Zeitplan "0 8 * * 1,3,5" wurde hier eingefaltet:
#   - alle 15 Min: Scheduled Posts auf Instagram publishen (eigentlicher Betrieb)
#   - Mo/Mi/Fr ab 10:00 Europe/Berlin: Event-Posts generieren, genau 1x pro Tag
#     (Zeitfenster + atomarer Tagesschalter in der DB, siehe src/routes/cron.ts).
# Cloudflare-Crons laufen in UTC; die Ortszeit wird deshalb im Code geprüft,
# nicht im Cron-Ausdruck — sonst verschiebt sie sich mit der Sommerzeit.
crons = ["*/15 * * * *"]

# Secrets (set via `wrangler secret put`):
# DATABASE_URL
# OPENAI_API_KEY
# SHOTSTACK_API_KEY
# INSTAGRAM_APP_ID
# INSTAGRAM_APP_SECRET
# NEON_AUTH_URL
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# R2_PUBLIC_URL
# CF_ACCOUNT_ID
# CF_API_TOKEN
# TROUPE_SUPABASE_URL
# TROUPE_SUPABASE_KEY
# DISCORD_WEBHOOK_URL  (wrangler secret put DISCORD_WEBHOOK_URL)
